services:
  ting-app:
    image: nqh44/ting:v1.0.0
    container_name: ting-app
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ting-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
